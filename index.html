<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小言工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>小言在路上 | 亚马逊清仓重启 · 工作台</title>
<style>:root{
  --bg:#FAF8F3; --card:#FFFFFF; --ink:#33352F; --ink2:#6E7269; --ink3:#9A9E94;
  --line:#E8E5DA; --line2:#D8D4C6;
  --red:#E8402A; --red-d:#C4331F; --red-l:#FCECE8;
  --green:#5C7F68; --green-l:#EAF1EA; --green-d:#3E5C49;
  --warm:#C0865C; --warm-l:#FAF0E6;
  --blue:#CFE3EA; --blue-l:#EAF4F7;
  --r:14px; --rs:9px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 100px}
header{padding:24px 0 12px}
.brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.5px}
.brand .sub{font-size:12.5px;color:var(--red);font-weight:500}
.motto{margin:9px 0 0;font-size:13.5px;color:var(--green-d);font-weight:500}
.motto small{display:block;font-weight:400;color:var(--ink3);font-size:12px;margin-top:3px}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px 0 13px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--line);margin-bottom:18px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line2);background:var(--card);color:var(--ink2);padding:7px 15px;border-radius:999px;font-size:13.5px;font-family:var(--font);cursor:pointer;transition:.15s}
nav button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:500}
nav button:not(.on):hover{border-color:var(--red);color:var(--red)}
section{display:none;animation:fade .22s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.tint{background:var(--green-l);border-color:#DCE8DC}
.card.redtint{background:var(--red-l);border-color:#F3D5CF}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
h3{font-size:14.5px;font-weight:600;margin:18px 0 8px}
.hint{font-size:12.5px;color:var(--ink3);margin:0 0 14px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);padding:8px 14px;border-radius:var(--rs);font-size:13px;font-family:var(--font);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--red-d);border-color:#EBD4D0}
.btn.danger:hover{border-color:var(--red-d);color:var(--red-d)}
.btn.grow{flex:1}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.mini{font-size:12px;color:var(--ink3)}
.red{color:var(--red)}
input[type=text],input[type=number],input[type=date],textarea,select{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:var(--rs);padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-l)}
textarea{resize:vertical;line-height:1.8}
label.lbl{font-size:12.5px;color:var(--ink2);display:block;margin:0 0 5px}
.field{margin-bottom:13px;flex:1;min-width:0}
.note{font-size:12.5px;color:var(--ink2);background:#FCFBF7;border-left:3px solid var(--line2);padding:9px 12px;border-radius:0 var(--rs) var(--rs) 0;margin:10px 0;line-height:1.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:36px 10px}
.empty-sm{text-align:center;color:var(--ink3);font-size:12.5px;padding:16px 6px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:13.5px;margin-top:8px}
.kv dt{color:var(--ink3);font-size:12.5px}
.kv dd{margin:0}
.chev{color:var(--ink3);font-size:15px;transition:.2s}
.chev.open{transform:rotate(180deg)}

/* 进度条 */
.prog-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.segs{display:flex;gap:4px}
.seg{flex:1;height:12px;border-radius:3px;background:#EADDD9;transition:.2s}
.seg.fill{background:var(--red)}
.inv-edit{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.inv-edit input[type=number]{width:92px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi-num{font-size:30px;font-weight:600;color:var(--red);line-height:1.2;letter-spacing:-1px}
.kpi-lb{font-size:12.5px;color:var(--ink3);margin-top:3px}

/* 投票 */
.vote-list{margin-top:6px}
.vote-row{display:flex;gap:10px;align-items:center;padding:7px 0}
.vote-rank{width:20px;height:20px;border-radius:50%;background:var(--red-l);color:var(--red-d);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.vote-main{flex:1;min-width:0}
.vote-name{font-size:13px;margin-bottom:4px}
.vote-track{height:7px;background:#F0EDE5;border-radius:4px;overflow:hidden}
.vote-fill{height:100%;background:var(--red);border-radius:4px;transition:.3s}
.vote-count{font-size:12px;color:var(--ink3);white-space:nowrap}

/* 最佳视频 */
.best-title{font-size:15px;font-weight:600;line-height:1.5;margin:8px 0 4px}
.best-meta{font-size:12px;color:var(--ink3)}
.stat-row{display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--ink2)}

/* 筛选 */
.filter-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto;border:1px solid var(--line2);background:var(--card);color:var(--ink2);padding:6px 12px;border-radius:999px;font-size:12.5px;font-family:var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.fbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.fnum{font-size:10.5px;opacity:.75;background:rgba(0,0,0,.06);padding:0 6px;border-radius:999px}
.fbtn.on .fnum{background:rgba(255,255,255,.25)}

/* 视频卡片 */
.vcard{padding:0;overflow:hidden}
.vc-head{display:flex;gap:11px;align-items:flex-start;padding:15px 16px 6px;cursor:pointer}
.vc-idx{font-size:11px;font-weight:600;color:var(--red-d);background:var(--red-l);padding:3px 8px;border-radius:6px;white-space:nowrap;margin-top:2px}
.vc-main{flex:1;min-width:0}
.vc-title{font-size:14.5px;font-weight:600;line-height:1.45}
.vc-sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.vc-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.vc-tags{display:flex;gap:5px;flex-wrap:wrap;padding:0 16px 13px}
.pp{font-size:10.5px;padding:2px 7px;border-radius:5px;background:#F2F1EC;color:var(--ink3)}
.pp.on{background:var(--green-l);color:var(--green-d);font-weight:500}
.pp.warm{background:var(--warm-l);color:var(--warm)}
.vc-detail{border-top:1px solid var(--line);padding:12px 16px;background:#FDFCFA}
.dline{display:flex;gap:10px;font-size:12.5px;line-height:1.7;padding:5px 0;border-bottom:1px dashed var(--line)}
.dline:last-of-type{border-bottom:none}
.dk{color:var(--ink3);flex:0 0 62px}
.dline span:last-child{color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.vc-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap;background:var(--green-l);color:var(--green-d)}
.pill.gray{background:#F2F1EC;color:var(--ink3)}
.st-to_shoot{background:#F2F1EC;color:var(--ink2)}
.st-editing{background:var(--warm-l);color:var(--warm)}
.st-to_publish{background:var(--blue-l);color:#3F6E82}
.st-published{background:var(--green-l);color:var(--green-d)}

/* 地点卡片 */
.pc-head{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.pc-main{flex:1;min-width:0}
.pc-name{font-size:15px;font-weight:600}
.pc-meta{display:flex;gap:6px;margin-top:5px}
.pc-feats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.feat{font-size:11.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:3px}
.yn{font-weight:600}
.yn.yes{color:var(--green)}
.yn.no{color:var(--ink3)}
.pc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.stars{color:var(--warm);letter-spacing:1px}
.pc-note{font-size:12.5px;color:var(--ink2);background:#FCFBF7;border-radius:var(--rs);padding:8px 11px;margin-top:10px;line-height:1.6}

/* 弹层 */
.overlay{position:fixed;inset:0;background:rgba(30,28,24,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0}
.xbtn{border:none;background:none;font-size:18px;color:var(--ink3);cursor:pointer;padding:4px 8px}
.sheet-body{padding:16px 18px;overflow-y:auto;flex:1}
.sheet-foot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--card)}
.sheet-foot .btn{flex:1}
.frow{display:flex;gap:10px}
.frow3{display:flex;gap:8px}
.frow3 .field{min-width:0}
.shotboxes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shotbox{display:flex;flex-wrap:wrap;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:var(--rs);padding:8px;font-size:12.5px;cursor:pointer;background:var(--card)}
.shotbox.on{background:var(--green-l);border-color:#A8C6AE}
.shotbox input{accent-color:var(--green);margin:0}
.shotbox small{width:100%;font-size:10.5px;color:var(--ink3);line-height:1.4}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog-grid{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;background:var(--card)}
.tog input{accent-color:var(--green);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>小言在路上</h1><span class="sub">| 亚马逊清仓重启</span></div>
    <p class="motto">在风景里搞钱的松弛感<small>70% 治愈风景 + 30% 亚马逊工作切片 · 深圳光明</small></p>
  </header>
  <nav id="nav"></nav>

</div>
<script id="DATA" type="application/json">{

    {"id": "p1", "name": "虹桥公园", "area": "光明区", "type": "公园", "wifi": false, "socket": false, "toilet": true, "quiet": true, "scenery": 5, "laptopOk": false, "note": "红色栈道，破局重启的彩头；适合拍红桥背影"},
    {"id": "p2", "name": "光明文化艺术中心", "area": "光明区", "type": "文化场馆", "wifi": true, "socket": true, "toilet": true, "quiet": true, "scenery": 4, "laptopOk": true, "note": "清水混凝土+光明之眼倒影；旁边图书馆有空调插座"},
    {"id": "p3", "name": "大顶岭绿道（三桥）", "area": "光明区", "type": "绿道", "wifi": false, "socket": false, "toilet": false, "quiet": true, "scenery": 5, "laptopOk": false, "note": "悬桥/探桥/浮桥，森林覆盖率高；电脑放车里"},
    {"id": "p4", "name": "茅洲河碧道", "area": "光明区", "type": "公园", "wifi": false, "socket": false, "toilet": true, "quiet": true, "scenery": 4, "laptopOk": true, "note": "开阔河岸拍日落绝佳；带野餐垫席地办公"},
    {"id": "p5", "name": "南头古城", "area": "南山区", "type": "创意园", "wifi": true, "socket": false, "toilet": true, "quiet": false, "scenery": 4, "laptopOk": true, "note": "复古街巷+创意小店，选品灵感"},
    {"id": "p6", "name": "华强北", "area": "福田区", "type": "商圈", "wifi": true, "socket": true, "toilet": true, "quiet": false, "scenery": 3, "laptopOk": true, "note": "深圳跨境精神地标，城市烟火气"},

    {"id": "p8", "name": "盐田灯塔图书馆", "area": "盐田区", "type": "图书馆", "wifi": true, "socket": true, "toilet": true, "quiet": true, "scenery": 5, "laptopOk": true, "note": "海边白色灯塔，安静办公出片"}

<script>/* ============ 小言在路上 · 视频制作工作台 ============ */
const KEY = 'xy-vlog-studio-v2';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D = JSON.parse($('#DATA').textContent);
const PLATS = D.platforms;
const STATUS = D.statuses;

function deepMerge(base, patch){
  if(!patch || typeof patch!=='object' || Array.isArray(patch)) return base;
  for(const k of Object.keys(patch)){
    if(patch[k] && typeof patch[k]==='object' && !Array.isArray(patch[k]) && base[k] && typeof base[k]==='object' && !Array.isArray(base[k])){
      deepMerge(base[k], patch[k]);
    } else base[k] = patch[k];
  }
  return base;
}
const blankVideo = () => ({
  id: '', station: '', place: '', title: '', hook: '', script: '',
  shots: {}, invBefore: '', invAfter: '', clearedToday: '', workSlice: '',
  platforms: { '抖音':'未发', '小红书':'未发', 'B站':'未发', '公众号':'未发' },
  views: '', likes: '', comments: '', review: '', nextVote: '',
  pubDate: '', status: 'to_shoot'
});
const DEFAULT = () => ({
  version: 2,
  inventory: { start: 359, current: 359 },
  videos: [],
  places: JSON.parse(JSON.stringify(D.seedPlaces)),
  votes: {},
  settings: { quote: '' }
});
let S = DEFAULT();
try{ const raw = localStorage.getItem(KEY); if(raw){ deepMerge(S, JSON.parse(raw)); } }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('本地存储写入失败，请导出备份'); } };

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekStart(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d; }
function inWeek(dateStr){ if(!dateStr) return false; const t=new Date(dateStr+'T00:00:00'); return t>=weekStart() && t<=new Date(); }
function num(v){ const n=parseInt(v); return isNaN(n)?0:n; }
function fmt(n){ return n>=10000? (n/10000).toFixed(1)+'w' : String(n); }

/* ---------- 导航 ---------- */
const TABS=[['dash','仪表盘'],['videos','视频'],['places','地点库'],['data','数据']];
$('#nav').innerHTML = TABS.map((t,i)=>`<button data-t="${t[0]}" class="${i===0?'on':''}">${t[1]}</button>`).join('');
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('button[data-t]'); if(!b)return; go(b.dataset.t); });
function go(t){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));
  render(t); window.scrollTo({top:0,behavior:'smooth'});
}
function render(t){ ({dash:rDash,videos:rVideos,places:rPlaces,data:rData})[t](); }

/* ---------- 通用：库存进度条 ---------- */
function invBar(){
  const cur=S.inventory.current, start=S.inventory.start;
  const pct = start>0 ? Math.max(0,Math.min(100,Math.round((1-cur/start)*100))) : 0;
  const filled = start>0 ? Math.round((cur/start)*10) : 0;
  const segs=Array.from({length:10},(_,i)=>`<div class="seg ${i<filled?'fill':''}"></div>`).join('');
  return `<div class="prog-label"><span>剩余 <b class="red">${cur}</b> 件</span><span>${start} → 0 · 已清 ${pct}%</span></div><div class="segs">${segs}</div>`;
}

/* ---------- 仪表盘 ---------- */
function rDash(){
  const vs=S.videos;
  const pubThisWeek = vs.filter(v=>v.status==='published' && inWeek(v.pubDate)).length;
  const editing = vs.filter(v=>v.status==='editing').length;
  const toShoot = vs.filter(v=>v.status==='to_shoot').length;
  const toPub = vs.filter(v=>v.status==='to_publish').length;

  const tally={};
  Object.entries(S.votes||{}).forEach(x=>{ if(x[1]>0) tally[x[0]]=(tally[x[0]]||0)+x[1]; });
  vs.forEach(v=>{ if(v.nextVote && v.nextVote.trim()) tally[v.nextVote.trim()]=(tally[v.nextVote.trim()]||0)+1; });
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);

  let best=vs.filter(v=>num(v.views)>0 && inWeek(v.pubDate)).sort((a,b)=>num(b.views)-num(a.views))[0];
  if(!best) best=vs.filter(v=>num(v.views)>0).sort((a,b)=>num(b.views)-num(a.views))[0];

  $('#s-dash').innerHTML=`
    <div class="card redtint">
      <h2>📦 库存进度</h2>
      ${invBar()}
      <div class="inv-edit">
        <label class="lbl" style="margin:0">更新剩余库存</label>
        <input type="number" id="invCur" value="${S.inventory.current}" min="0">
        <button class="btn sm pri" id="invSave">保存</button>
        <span class="mini">起始 <input type="number" id="invStart" value="${S.inventory.start}" min="1" style="width:76px;display:inline-block;padding:4px 7px"></span>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-num">${S.inventory.current}</div><div class="kpi-lb">剩余库存</div></div>
      <div class="kpi"><div class="kpi-num">${pubThisWeek}</div><div class="kpi-lb">本周发布</div></div>
      <div class="kpi"><div class="kpi-num">${editing}</div><div class="kpi-lb">待剪辑</div></div>
      <div class="kpi"><div class="kpi-num">${toShoot+toPub}</div><div class="kpi-lb">待拍+待发</div></div>
    </div>

    <div class="card">
      <h2>🗳️ 下一站投票</h2>
      <p class="hint">在视频卡片填「下一站投票」，或直接点下面投票。</p>
      ${top.length?`<div class="vote-list">${top.map((x,i)=>{
        const max=top[0][1]||1;
        return `<div class="vote-row"><span class="vote-rank">${i+1}</span><div class="vote-main"><div class="vote-name">${esc(x[0])}</div><div class="vote-track"><div class="vote-fill" style="width:${Math.round(x[1]/max*100)}%"></div></div></div><span class="vote-count">${x[1]}票</span></div>`;
      }).join('')}</div>`:`<div class="empty-sm">还没有投票，先给下一站投一票吧</div>`}
      <div class="row" style="margin-top:12px">
        <select id="votePlace" class="grow"><option value="">选地点投票…</option>${S.places.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('')}</select>
        <button class="btn sm pri" id="voteBtn">投票</button>
      </div>
    </div>

    <div class="card tint">
      <h2>⭐ 本周最佳视频</h2>
      ${best?`<div class="best-title">${esc(best.title||'（无标题）')}</div>
      <div class="best-meta">${best.station?'第'+esc(best.station)+'站 · ':''}${esc(best.place||'未填地点')} ${best.pubDate?'· '+esc(best.pubDate):''}</div>
      <div class="stat-row"><span>▶ ${fmt(num(best.views))}</span><span>♥ ${fmt(num(best.likes))}</span><span>💬 ${fmt(num(best.comments))}</span></div>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-edit="${best.id}">编辑这条</button></div>`
      :`<div class="empty-sm">还没有带播放数据的视频，发布后回填数据就能评比</div>`}
    </div>

    <div class="card">
      <h2>快速开一条</h2>
      <div class="row"><button class="btn pri" id="quickAdd">+ 新增视频</button><button class="btn" id="goVideos">查看全部 ${vs.length} 条</button></div>
    </div>
    <div class="note">${esc(D.quote)}</div>
  `;

  $('#invSave').onclick=()=>{ const v=parseInt($('#invCur').value); if(isNaN(v)){toast('请输入数字');return;} S.inventory.current=Math.max(0,v); save(); render('dash'); toast('库存已更新'); };
  $('#invStart').onchange=e=>{ const v=parseInt(e.target.value); if(!isNaN(v)&&v>0){S.inventory.start=v;save();render('dash');} };
  $('#voteBtn').onclick=()=>{ const name=$('#votePlace').value; if(!name){toast('先选一个地点');return;} S.votes[name]=(S.votes[name]||0)+1; save(); render('dash'); toast('已投给 '+name); };
  $('#goVideos').onclick=()=>go('videos');
  $('#quickAdd').onclick=()=>openVideo();
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openVideo(b.dataset.edit));
}

let FILTER='all';
let EXPANDED={};
function statusPill(id){ const s=STATUS.find(x=>x.id===id)||STATUS[0]; return `<span class="pill st-${id}">${s.name}</span>`; }
function rVideos(){
  const list=S.videos.filter(v=>FILTER==='all'||v.status===FILTER);
  const counts={all:S.videos.length};
  STATUS.forEach(s=>counts[s.id]=S.videos.filter(v=>v.status===s.id).length);
  const tabs=[['all','全部'],...STATUS.map(s=>[s.id,s.name])];
  $('#s-videos').innerHTML=`
    <div class="card" style="padding:12px">
      <div class="filter-row">${tabs.map(t=>`<button class="fbtn ${FILTER===t[0]?'on':''}" data-f="${t[0]}">${t[1]}<span class="fnum">${counts[t[0]]}</span></button>`).join('')}</div>
    </div>
    <div class="row" style="margin-bottom:14px"><button class="btn pri grow" id="addVideo">+ 新增视频</button></div>
    <div id="videoList">
      ${list.length? list.map(v=>videoCard(v)).join('') : `<div class="card"><div class="empty">这个分类还没有视频<br><button class="btn sm pri" id="emptyAdd" style="margin-top:10px">新增一条</button></div></div>`}
    </div>
  `;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render('videos');});
  $('#addVideo').onclick=()=>openVideo();
  const ea=$('#emptyAdd'); if(ea) ea.onclick=()=>openVideo();
  bindVideoCards();
}
function videoCard(v){
  const open=!!EXPANDED[v.id];
  const platHtml=PLATS.map(p=>`<span class="pp ${v.platforms[p]==='已发'?'on':''}">${p}${v.platforms[p]==='已发'?'✓':''}</span>`).join('');
  const shotsOn=D.shots.filter(s=>v.shots[s.id]).map(s=>s.id).join('');
  return `<div class="card vcard">
    <div class="vc-head" data-toggle="${v.id}">
      <div class="vc-idx">${v.station?'第'+esc(v.station)+'站':'—'}</div>
      <div class="vc-main">
        <div class="vc-title">${esc(v.title||'（无标题）')}</div>
        <div class="vc-sub">${esc(v.place||'未填地点')}${v.pubDate?' · '+esc(v.pubDate):''}${shotsOn?' · 镜头'+shotsOn:''}</div>
      </div>
      <div class="vc-side">${statusPill(v.status)}<span class="chev ${open?'open':''}">▾</span></div>
    </div>
    <div class="vc-tags">${platHtml}${num(v.views)>0?`<span class="pp">▶${fmt(num(v.views))}</span>`:''}${v.nextVote?`<span class="pp warm">下一站:${esc(v.nextVote)}</span>`:''}</div>
    ${open?`<div class="vc-detail">
      ${v.hook?`<div class="dline"><span class="dk">3秒钩子</span><span>${esc(v.hook)}</span></div>`:''}
      ${v.script?`<div class="dline"><span class="dk">脚本</span><span>${esc(v.script)}</span></div>`:''}
      ${v.workSlice?`<div class="dline"><span class="dk">工作切片</span><span>${esc(v.workSlice)}</span></div>`:''}
      ${(v.invBefore!==''||v.invAfter!==''||v.clearedToday!=='')?`<div class="dline"><span class="dk">库存</span><span>${esc(v.invBefore)}→${esc(v.invAfter)} · 今日清 ${esc(v.clearedToday)}</span></div>`:''}
      ${v.review?`<div class="dline"><span class="dk">复盘</span><span>${esc(v.review)}</span></div>`:''}
      ${v.nextVote?`<div class="dline"><span class="dk">下一站</span><span>${esc(v.nextVote)}</span></div>`:''}
      <div class="vc-actions">
        <button class="btn sm" data-edit="${v.id}">编辑</button>
        <button class="btn sm danger" data-del="${v.id}">删除</button>
      </div>
    </div>`:''}
  </div>`;
}
function bindVideoCards(){
  document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{const id=el.dataset.toggle;EXPANDED[id]=!EXPANDED[id];render('videos');});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();openVideo(b.dataset.edit);});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const id=b.dataset.del;
    if(!confirm('删除这条视频？无法撤销。'))return;
    S.videos=S.videos.filter(x=>x.id!==id); save(); render('videos'); toast('已删除');
  });
}

        <div class="field"><label class="lbl">脚本</label><textarea id="fScript" rows="4" placeholder="分镜/旁白稿">${esc(v.script)}</textarea></div>

        <div class="field"><label class="lbl">发布状态</label><div class="pgrid">${platSel}</div></div>
        <div class="frow3">
          <div class="field"><label class="lbl">播放</label><input type="number" id="fViews" value="${esc(v.views)}" placeholder="0"></div>
          <div class="field"><label class="lbl">点赞</label><input type="number" id="fLikes" value="${esc(v.likes)}" placeholder="0"></div>
          <div class="field"><label class="lbl">评论</label><input type="number" id="fComments" value="${esc(v.comments)}" placeholder="0"></div>

        <div class="field"><label class="lbl">复盘</label><textarea id="fReview" rows="2" placeholder="这条哪里好/哪里差">${esc(v.review)}</textarea></div>

  };

  $('#impBtn').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ const p=JSON.parse(r.result); deepMerge(S,p); save(); render('data'); toast('备份已导入'); }catch(err){ toast('文件解析失败'); } };
    r.readAsText(f);
  };
  $('#resetBtn').onclick=()=>{
    if(!confirm('确定全局重置？所有视频、地点、库存、投票都会清空，无法撤销。建议先导出备份。'))return;
    localStorage.removeItem(KEY); S=DEFAULT(); save(); render('data'); toast('已重置');
  };
}

/* ---------- boot ---------- */
go('dash');
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
